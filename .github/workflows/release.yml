name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Action'
        required: true
        type: choice
        options:
          - 'current'
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
        default: 'current'
      release_type:
        description: 'Release Classification'
        required: true
        type: choice
        options:
          - 'pre-release (RC)'
          - 'stable (Full Release)'
        default: 'pre-release (RC)'
      custom_tag:
        description: 'Custom Tag (only evaluated if bump=custom)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Package Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: core
          fetch-depth: 0

      - name: Print Build Environment & Checked-Out Ref
        run: |
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "=== Core Repository Status ==="
          git -C core rev-parse HEAD
          git -C core status

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          git -C core fetch --tags --force
          python3 core/.github/scripts/calculate_version.py \
            --repo-dir core \
            --event "${{ github.event_name }}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --bump "${{ github.event.inputs.bump }}" \
            --release-type "${{ github.event.inputs.release_type }}" \
            --custom-tag "${{ github.event.inputs.custom_tag }}"

      - name: Package Distribution
        run: |
          mkdir -p core/dist
          mkdir -p core/static/kiosk
          
          # Create comprehensive self-contained distribution tarball
          PACKAGE_NAME="storydeck-core-${{ steps.meta.outputs.tag }}.tar.gz"
          cd core
          tar --exclude='./venv' \
              --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./data/broker.db' \
              --exclude='./__pycache__' \
              --exclude='*.pyc' \
              -czf "dist/${PACKAGE_NAME}" .
          echo "Created distribution archive: dist/${PACKAGE_NAME}"

      - name: Prepare Release Notes Banner
        id: notes
        run: |
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          NOTES_FILE="core/release_notes.md"
          TEMP_FILE="core/release_notes_combined.md"
          rm -f "${TEMP_FILE}"

          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "> [!WARNING]" >> "${TEMP_FILE}"
            echo "> This release is intended for testing purposes only. Please do not use it with production data, as frequent updates and architectural changes may occur between pre-release versions." >> "${TEMP_FILE}"
            echo "" >> "${TEMP_FILE}"
          fi

          if [ -f "${NOTES_FILE}" ]; then
            cat "${NOTES_FILE}" >> "${TEMP_FILE}"
          fi
          touch "${TEMP_FILE}"
          mv "${TEMP_FILE}" "${NOTES_FILE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          body_path: core/release_notes.md
          files: |
            core/dist/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRE="${{ steps.meta.outputs.prerelease }}"

          # Always tag with the exact release/pre-release tag name
          TAGS="${IMAGE_NAME_LOWER}:${TAG}"

          if [ "${IS_PRE}" = "true" ]; then
            echo "Building Pre-release container; tagging as :dev"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:dev"
          else
            echo "Building Full release container; tagging as :latest"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Resolved Docker Tags: ${TAGS}"

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          platforms: linux/amd64,linux/arm64
