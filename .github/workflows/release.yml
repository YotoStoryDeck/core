name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, v1.0.0-rc.1, v1.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Core (with Web-Touch Assets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: core
          fetch-depth: 0

      - name: Checkout Touch Repository (for web-touch companion assets)
        uses: actions/checkout@v4
        with:
          repository: YotoStoryDeck/touch
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: touch
          fetch-depth: 1

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG} (Pre-release: ${IS_PRERELEASE})"

      - name: Bundle Web-Touch Assets into Core Distribution
        run: |
          mkdir -p core/dist
          # Bundle static web-touch assets directly into core static/kiosk directory
          mkdir -p core/static/kiosk
          cp -r touch/web-touch/* core/static/kiosk/
          
          # Create comprehensive self-contained distribution tarball
          PACKAGE_NAME="storydeck-core-${{ steps.meta.outputs.tag }}.tar.gz"
          cd core
          tar --exclude='./venv' \
              --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./data/broker.db' \
              --exclude='./__pycache__' \
              --exclude='*.pyc' \
              -czf "dist/${PACKAGE_NAME}" .
          echo "Created distribution archive: dist/${PACKAGE_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StoryDeck Core ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          files: |
            core/dist/*
