name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, v1.0.0-rc.1, v1.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Package Core (with Web-Touch Assets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: core
          fetch-depth: 0

      - name: Checkout Touch Repository (for web-touch companion assets)
        uses: actions/checkout@v4
        with:
          repository: YotoStoryDeck/touch
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: touch
          fetch-depth: 1

      - name: Print Build Environment & Checked-Out Ref
        run: |
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "=== Core Repository Status ==="
          git -C core rev-parse HEAD
          git -C core status
          echo "=== Touch Repository Status ==="
          git -C touch rev-parse HEAD
          git -C touch status

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG} (Pre-release: ${IS_PRERELEASE})"

      - name: Bundle Web-Touch Assets into Core Distribution
        run: |
          mkdir -p core/dist
          # Bundle static web-touch assets directly into core static/kiosk directory
          mkdir -p core/static/kiosk
          cp -r touch/web-touch/* core/static/kiosk/
          
          # Create comprehensive self-contained distribution tarball
          PACKAGE_NAME="storydeck-core-${{ steps.meta.outputs.tag }}.tar.gz"
          cd core
          tar --exclude='./venv' \
              --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./data/broker.db' \
              --exclude='./__pycache__' \
              --exclude='*.pyc' \
              -czf "dist/${PACKAGE_NAME}" .
          echo "Created distribution archive: dist/${PACKAGE_NAME}"

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          cd core
          git fetch --tags --force

          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          echo "Resolving previous tag for changelog comparison..."
          if [ "${IS_PRERELEASE}" = "true" ]; then
            # Pre-release: Compare against the immediate previous tag (stable or pre-release)
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
            echo "Pre-release: Previous tag resolved to '${PREV_TAG:-none}'"
          else
            # Full release: Compare against previous full/stable release (exclude pre-releases with '-')
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
            echo "Full release: Previous stable tag resolved to '${PREV_TAG:-none}'"
          fi

          NOTES_FILE="release_notes.md"
          rm -f "${NOTES_FILE}"

          # Mimic donetick pre-release warning callout
          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "> [!WARNING]" >> "${NOTES_FILE}"
            echo "> This release is intended for testing purposes only. Please do not use it with production data, as frequent updates and architectural changes may occur between pre-release versions." >> "${NOTES_FILE}"
            echo "" >> "${NOTES_FILE}"
          fi

          echo "## Changelog" >> "${NOTES_FILE}"

          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %H: %s (@%an)")
            if [ -n "${COMMITS}" ]; then
              echo "${COMMITS}" >> "${NOTES_FILE}"
            else
              echo "* Maintenance release / no commit delta" >> "${NOTES_FILE}"
            fi
            echo "" >> "${NOTES_FILE}"
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> "${NOTES_FILE}"
          else
            COMMITS=$(git log --pretty=format:"* %H: %s (@%an)")
            if [ -n "${COMMITS}" ]; then
              echo "${COMMITS}" >> "${NOTES_FILE}"
            else
              echo "* Initial release" >> "${NOTES_FILE}"
            fi
            echo "" >> "${NOTES_FILE}"
          fi

          echo "Generated release notes:"
          cat "${NOTES_FILE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          body_path: core/release_notes.md
          files: |
            core/dist/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRE="${{ steps.meta.outputs.prerelease }}"

          # Always tag with the exact release/pre-release tag name
          TAGS="${IMAGE_NAME_LOWER}:${TAG}"

          if [ "${IS_PRE}" = "true" ]; then
            echo "Building Pre-release container; tagging as :dev"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:dev"
          else
            echo "Building Full release container; tagging as :latest"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Resolved Docker Tags: ${TAGS}"

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
