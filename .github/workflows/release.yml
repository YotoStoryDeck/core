name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Action'
        required: true
        type: choice
        options:
          - 'current'
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
        default: 'current'
      release_type:
        description: 'Release Classification'
        required: true
        type: choice
        options:
          - 'pre-release (RC)'
          - 'stable (Full Release)'
        default: 'pre-release (RC)'
      custom_tag:
        description: 'Custom Tag (only evaluated if bump=custom)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Package Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: core
          fetch-depth: 0

      - name: Print Build Environment & Checked-Out Ref
        run: |
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "=== Core Repository Status ==="
          git -C core rev-parse HEAD
          git -C core status

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          git -C core fetch --tags --force
          python3 core/.github/scripts/calculate_version.py \
            --repo-dir core \
            --event "${{ github.event_name }}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --bump "${{ github.event.inputs.bump }}" \
            --release-type "${{ github.event.inputs.release_type }}" \
            --custom-tag "${{ github.event.inputs.custom_tag }}"

      - name: Package Distribution
        run: |
          mkdir -p core/dist
          mkdir -p core/static/kiosk
          
          # Create comprehensive self-contained distribution tarball
          PACKAGE_NAME="storydeck-core-${{ steps.meta.outputs.tag }}.tar.gz"
          cd core
          tar --exclude='./venv' \
              --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./data/broker.db' \
              --exclude='./__pycache__' \
              --exclude='*.pyc' \
              -czf "dist/${PACKAGE_NAME}" .
          echo "Created distribution archive: dist/${PACKAGE_NAME}"

      - name: Generate Changelog & Release Notes
        id: notes
        run: |
          cd core
          git fetch --tags --force

          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          NOTES_FILE="release_notes.md"
          rm -f "${NOTES_FILE}"

          # Helper function to generate git log commit changelog
          generate_changelog() {
            local out="$1"
            echo "Resolving previous tag for changelog comparison..."
            if [ "${IS_PRERELEASE}" = "true" ]; then
              PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
              echo "Pre-release: Previous tag resolved to '${PREV_TAG:-none}'"
            else
              PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
              echo "Full release: Previous stable tag resolved to '${PREV_TAG:-none}'"
            fi

            echo "## Changelog" >> "${out}"
            if [ -n "${PREV_TAG}" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %H: %s (@%an)")
              if [ -n "${COMMITS}" ]; then
                echo "${COMMITS}" >> "${out}"
              else
                echo "* Maintenance release / no commit delta" >> "${out}"
              fi
              echo "" >> "${out}"
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> "${out}"
            else
              COMMITS=$(git log --pretty=format:"* %H: %s (@%an)")
              if [ -n "${COMMITS}" ]; then
                echo "${COMMITS}" >> "${out}"
              else
                echo "* Initial release" >> "${out}"
              fi
              echo "" >> "${out}"
            fi
          }

          if [ "${IS_PRERELEASE}" = "true" ]; then
            # Pre-releases always use the warning banner + commit changelog
            cat << 'EOF' >> "${NOTES_FILE}"
> [!WARNING]
> This release is intended for testing purposes only. Please do not use it with production data, as frequent updates and architectural changes may occur between pre-release versions.

EOF
            generate_changelog "${NOTES_FILE}"
          else
            # Full releases look for release-v[tag].md (e.g., release-v1.1.0.md)
            MATCHED_FILE=""
            CLEAN_VER=$(echo "${TAG}" | sed -E 's/^[[:space:]]*[vV]+//')
            if [ -f "release-${TAG}.md" ]; then
              MATCHED_FILE="release-${TAG}.md"
            elif [ -f "release-v${CLEAN_VER}.md" ]; then
              MATCHED_FILE="release-v${CLEAN_VER}.md"
            fi

            if [ -n "${MATCHED_FILE}" ]; then
              echo "Found matching release file for full release: ${MATCHED_FILE}"
              cat "${MATCHED_FILE}" >> "${NOTES_FILE}"
            else
              echo "No matching release-${TAG}.md found. Falling back to commit changelog."
              generate_changelog "${NOTES_FILE}"
            fi
          fi

          echo "Final release notes generated:"
          cat "${NOTES_FILE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          body_path: core/release_notes.md
          files: |
            core/dist/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: docker_meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRE="${{ steps.meta.outputs.prerelease }}"

          # Always tag with the exact release/pre-release tag name
          TAGS="${IMAGE_NAME_LOWER}:${TAG}"

          if [ "${IS_PRE}" = "true" ]; then
            echo "Building Pre-release container; tagging as :dev"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:dev"
          else
            echo "Building Full release container; tagging as :latest"
            TAGS="${TAGS},${IMAGE_NAME_LOWER}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Resolved Docker Tags: ${TAGS}"

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          platforms: linux/amd64,linux/arm64
