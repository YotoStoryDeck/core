<!-- Modal Overlays -->
  <!-- 1. First-Run Setup Wizard Modal -->
  <div class="modal-overlay" id="setupModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>👋 Welcome to StoryDeck Core</h2>
        <p class="text-secondary">Create your primary administrator account to secure the portal.</p>
      </div>
      <form id="setupForm" onsubmit="handleInitialSetup(event)">
        <div class="form-group">
          <label for="setupUsername">Administrator Username</label>
          <input type="text" id="setupUsername" class="form-control" required placeholder="admin" autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="setupDisplayName">Display Name</label>
          <input type="text" id="setupDisplayName" class="form-control" placeholder="Parent" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="setupPassword">Password</label>
          <input type="password" id="setupPassword" class="form-control" required minlength="8" placeholder="••••••••••••" autocomplete="new-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Complete Setup & Secure StoryDeck Core</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Local Login Modal -->
  <div class="modal-overlay" id="loginModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🔒 Administrator Sign In</h2>
        <p class="text-secondary">Enter credentials to manage profiles and curation.</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" class="form-control" required placeholder="admin" autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••••••" autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </div>
      </form>
    </div>
  </div>
