<!-- Yoto Card Manual Series & Sequence Override Modals (DLP-021) -->
<datalist id="existingSeriesList"></datalist>

<!-- Single Card Series Override Modal -->
<div class="modal-overlay" id="editSeriesModal" style="display: none;">
  <div class="modal-card" style="max-width: 500px; width: 100%;">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
        <h2 style="font-size: 18px; margin: 0;">📚 Edit Card Series & Sequence</h2>
        <span class="badge badge-series-override" id="editSeriesOverrideBadge" style="display: none;">Custom Override</span>
      </div>
      <p class="text-secondary" style="margin: 0; font-size: 13px;">
        Assign a Yoto card to a series and book number. Manual overrides survive catalog refreshes.
      </p>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin: 14px 0; padding: 12px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 8px;">
      <img id="editSeriesCover" src="/static/img/placeholder.png" onerror="this.onerror=null; this.src='/static/img/placeholder.png';" alt="cover" style="width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0;">
      <div style="min-width: 0; flex: 1;">
        <div id="editSeriesCardTitle" style="font-weight: 600; color: var(--text-primary); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap;">
          <span id="editSeriesTypeBadge" class="badge badge-success">YOTO</span>
          <span id="editSeriesAutoHint" class="text-secondary" style="font-size: 11px;"></span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <label for="editSeriesNameInput" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
          Series / Group Name
        </label>
        <input type="text" id="editSeriesNameInput" class="form-control" list="existingSeriesList" placeholder="Enter or pick a series name (leave blank for Standalone)" autocomplete="off">
      </div>
      <div>
        <label for="editSeriesOrderInput" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
          Sequence / Book Number
        </label>
        <input type="text" id="editSeriesOrderInput" class="form-control" placeholder="e.g. 1, 2, 1.5, 1-3" autocomplete="off">
      </div>
    </div>

    <div class="form-actions" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap;">
      <button type="button" class="btn btn-secondary" id="editSeriesRevertBtn" onclick="revertEditSeriesModal()" style="display: none; color: var(--accent-abs); border-color: rgba(245, 158, 11, 0.4);">
        ↩ Revert to Auto
      </button>
      <div style="display: flex; gap: 8px; margin-left: auto;">
        <button type="button" class="btn btn-secondary" onclick="closeEditSeriesModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveEditSeriesModal()">Save Override</button>
      </div>
    </div>
  </div>
</div>

<!-- Bulk Drag-and-Drop Series Sequencer Modal -->
<div class="modal-overlay" id="batchSeriesModal" style="display: none;">
  <div class="modal-card" style="max-width: 660px; width: 100%;">
    <div class="modal-header">
      <h2 style="font-size: 18px; margin: 0 0 4px 0;">📚 Batch Series & Order Sequencer</h2>
      <p class="text-secondary" id="batchSeriesSubtitle" style="margin: 0; font-size: 13px;">
        Drag rows or use arrow buttons to set book order for selected Yoto cards.
      </p>
    </div>

    <div id="batchSeriesAbsNotice" style="display: none; margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; font-size: 12px;">
    </div>

    <div style="margin-top: 14px;">
      <label for="batchSeriesNameInput" style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
        Shared Series Name
      </label>
      <input type="text" id="batchSeriesNameInput" class="form-control" list="existingSeriesList" placeholder="e.g. BrainBots, Magic Tree House, Paw Patrol" autocomplete="off">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 8px 0; flex-wrap: wrap;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer;">
        <input type="checkbox" id="batchSeriesAutoNumber" checked onchange="onBatchSeriesAutoNumberToggle()">
        <span>Auto-number #1..N on reorder</span>
      </label>
      <button type="button" class="btn btn-secondary btn-sm" onclick="sortBatchSeriesAlpha()" title="Sort cards alphabetically by title">
        🔤 Sort A→Z
      </button>
    </div>

    <div id="batchSeriesList" class="custom-scrollbar" style="display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding: 10px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 8px;">
      <!-- Dynamically populated draggable sequencer rows -->
    </div>

    <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
      <button type="button" class="btn btn-secondary" onclick="closeBatchSeriesModal()">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveBatchSeriesModal()">Save Series & Order</button>
    </div>
  </div>
</div>
