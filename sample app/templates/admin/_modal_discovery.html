<!-- 4. Household Auto-Discovery Modal -->
  <div class="modal-overlay" id="discoveryModal" style="display: none;">
    <div class="modal-card" style="max-width: 680px; width: 100%;">
      <div class="modal-header">
        <h2>⚡ Household Auto-Discovery</h2>
        <p class="text-secondary">Automatically match your physical Yoto players with Audiobookshelf child accounts.</p>
      </div>
      <div id="discoveryLoading" style="text-align: center; padding: 30px;">
        <p class="text-secondary">Scanning local Streaming Bridge and Audiobookshelf server...</p>
      </div>
      <div id="discoveryResults" style="display: none;">
        <div style="max-height: 340px; overflow-y: auto; margin-bottom: 20px;">
          <table class="data-table" style="width: 100%;" id="discoveryTable">
            <thead>
              <tr>
                <th style="width: 40px;"><input type="checkbox" id="discoverySelectAll" checked onchange="toggleSelectAllDiscovery(this.checked)"></th>
                <th>Suggested Child</th>
                <th>Matched Yoto Player</th>
                <th>Audiobookshelf Account</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody id="discoveryTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
        <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn btn-secondary" onclick="closeDiscoveryModal()">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="confirmImportDiscovery()">Import Selected Profiles</button>
        </div>
      </div>
    </div>
  </div>
