<!-- 5. Curation Item Permissions & ABS Tagging Modal -->
  <div class="modal-overlay" id="curationPermissionsModal" style="display: none;">
    <div class="modal-card" style="max-width: 620px; width: 100%;">
      <div class="modal-header" style="display: flex; gap: 14px; align-items: center;">
        <img id="curationModalThumb" src="" class="cover-thumb-sm" style="width: 54px; height: 54px; border-radius: 6px; object-fit: cover;" alt="cover">
        <div style="flex: 1; min-width: 0;">
          <h2 id="curationModalTitle" style="font-size: 16px; margin: 0 0 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Item Permissions</h2>
          <p id="curationModalAuthor" class="text-secondary" style="margin: 0; font-size: 13px;">Author</p>
        </div>
        <span id="curationModalTypeBadge" class="badge">Type</span>
      </div>

      <div style="margin-top: 16px;">
        <h4 style="font-size: 13px; margin-bottom: 8px; color: var(--text-primary);">Child Profile Access Status</h4>
        <div id="curationModalProfilesList" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 10px; border-radius: 6px;">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- One-stop Audiobookshelf Tagging Section (for ABS items) -->
      <div id="curationModalAbsSection" style="display: none; margin-top: 16px; background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 8px; padding: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h4 style="font-size: 13px; color: var(--accent-abs); margin: 0;">⚡ Audiobookshelf Server Permissions</h4>
          <span id="curationModalAbsStatusBadge" class="badge badge-subtle" style="font-size: 10px;">Checking tags...</span>
        </div>
        <p class="text-secondary" style="font-size: 12px; margin-bottom: 8px;">
          Child accounts automatically inherit books tagged with configured default tags (<strong id="curationModalConfiguredTagsLabel">Children</strong>) directly from Audiobookshelf.
        </p>
        
        <div style="margin-bottom: 10px;">
          <label style="font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Current Server Tags on this Book:</label>
          <div id="curationModalTagsContainer" style="display: flex; gap: 4px; flex-wrap: wrap;">
            <!-- Rendered tags pills -->
          </div>
        </div>

        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <button type="button" id="btnToggleChildrenTag" class="btn btn-sm btn-primary" onclick="toggleItemDefaultChildTag()">
            🏷️ Add Default Tag to ABS
          </button>
          <div style="display: flex; gap: 4px; align-items: center;">
            <select id="curationModalTagDropdown" class="form-control" style="font-size: 11px; padding: 3px 6px; height: 28px;">
              <option value="">-- Add another ABS tag --</option>
            </select>
            <button type="button" class="btn btn-sm btn-secondary" style="font-size: 11px; padding: 3px 8px; height: 28px;" onclick="addTagFromModalDropdown()">+ Tag</button>
          </div>
        </div>
      </div>

      <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button type="button" class="btn btn-secondary" onclick="closeCurationPermissionsModal()">Done</button>
      </div>
    </div>
  </div>
